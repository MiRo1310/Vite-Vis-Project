# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x, 24.x ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: yarn install --frozen-lockfile  && yarn lint
        
  cypress-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15     
      backend:
        image: ghcr.io/miro1310/recipe:latest
        credentials:
          username: miro1310
          password: ${{ secrets.GHCR_PAT }}
        env:
          ConnectionStrings__AppDbConnectionString: "Server=mysql;Database=app;User=root;Password=root;"
          ConnectionStrings__FinanceDbConnectionString: "Server=mysql;Database=app;User=root;Password=root;"
          
        ports:
          - 5095:5095

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Debug backend container
        run: |
          docker ps -a
          docker logs $(docker ps -aq --filter ancestor=ghcr.io/miro1310/recipe:latest)

      - name: Wait for backend GraphQL endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5095/graphql; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend... ($i)"
            sleep 2
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Cypress run E2E Tests
        uses: cypress-io/github-action@v7
        env:
          LANG: de_DE.UTF-8
          TZ: Europe/Berlin
          VITE_GRAPHQL_URL: http://localhost:5095/graphql
        with:
          build: yarn run build
          start: yarn run dev
    needs:
      - build
      
  cypress-component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Cypress run Component Tests
        uses: cypress-io/github-action@v7
        with:         
          component: 'true'           
    needs:      
      - build  
      
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x, 24.x ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: yarn install --frozen-lockfile  && yarn build
        
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
      - run: yarn install --frozen-lockfile
      - name: Audit dependencies
        run: yarn audit
        continue-on-error: false
        
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
      - run: yarn install --frozen-lockfile
      - name: Vitest tests
        env:
          LANG: de_DE.UTF-8
          TZ: Europe/Berlin
        run: yarn run test
        continue-on-error: false