<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <clipPath id="signalClip">
      <rect x="0" y="0" width="512" height="228" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Smart signal arcs -->
  <g clip-path="url(#signalClip)" stroke="#ffffff" fill="none" stroke-linecap="round">
    <circle cx="256" cy="230" r="74" stroke-width="13" opacity="0.55" />
    <circle cx="256" cy="230" r="50" stroke-width="13" opacity="0.75" />
    <circle cx="256" cy="230" r="26" stroke-width="13" opacity="0.95" />
  </g>
  <circle cx="256" cy="230" r="9" fill="#ffffff" />

  <!-- House -->
  <polygon points="256,258 166,330 346,330" fill="#ffffff" />
  <rect x="176" y="330" width="160" height="130" fill="#ffffff" />
  <rect x="234" y="390" width="44" height="70" fill="#1e3a8a" />
  <circle cx="268" cy="426" r="3.5" fill="#ffffff" />
</svg>
